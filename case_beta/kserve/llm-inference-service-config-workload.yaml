apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceServiceConfig
metadata:
  name: llm-inference-service-config-workload
  namespace: beta
spec:
  replicas: 1
  template:
    hostNetwork: true
    nodeSelector:
      node-role.kubernetes.io/gpu-node: "true"
    tolerations:
      - key: "gpu-node"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
    imagePullSecrets:
      - name: registry-credentials
    containers:
      - name: main
        image: vllm/vllm-openai:latest
        command:
          - python3
          - -m
          - vllm.entrypoints.openai.api_server
        args:
          - --model
          - Qwen/Qwen3.6-27B
          - --port
          - "8000"
          - --host
          - "0.0.0.0"
          - --dtype
          - auto
          - --tensor-parallel-size
          - "1"
          - --max-model-len
          - "8192"
          - --max-num-seqs
          - "8"
          - --gpu-memory-utilization
          - "0.90"
          - --download-dir
          - /mnt/huggingface/models
          - --enable-prefix-caching
          - --enable-auto-tool-choice
          - --tool-call-parser
          - hermes
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
          - name: HF_XET_HIGH_PERFORMANCE
            value: "1"
          - name: VLLM_LOGGING_LEVEL
            value: "INFO"
          - name: PYTHONUNBUFFERED
            value: "1"
          - name: NVIDIA_VISIBLE_DEVICES
            value: "all"
          - name: NVIDIA_DRIVER_CAPABILITIES
            value: "compute,utility"
        volumeMounts:
          - name: dshm
            mountPath: /dev/shm
          - name: model-cache
            mountPath: /mnt/huggingface/models
        resources:
          limits:
            nvidia.com/gpu: "1"
            memory: 48Gi
          requests:
            nvidia.com/gpu: "1"
            memory: 32Gi
        securityContext:
          runAsNonRoot: false
          capabilities:
            drop:
              - ALL
    volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 4Gi
      - name: model-cache
        emptyDir: {}
