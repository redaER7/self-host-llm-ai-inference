apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceServiceConfig
metadata:
  name: qwen-workload
  namespace: beta
spec:
  replicas: 1
  template:
    hostNetwork: true
    nodeSelector:
      node-role.kubernetes.io/gpu-node: "true"
    tolerations:
      - key: "gpu-node"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
    imagePullSecrets:
      - name: registry-credentials
    containers:
      - name: main
        image: vllm/vllm-openai:latest
        command:
          - python3
          - -m
          - vllm.entrypoints.openai.api_server
        args:
          - --model
          - Qwen/Qwen2.5-3B-Instruct
          - --port
          - "8000"
          - --host
          - "0.0.0.0"
          - --dtype
          - auto
          - --max-model-len
          - "4096"
          - --gpu-memory-utilization
          - "0.9"
          - --download-dir
          - /root/.cache/huggingface
        
        # Add all working environment variables
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-token
                key: token
          - name: HF_XET_HIGH_PERFORMANCE
            value: "1"
          - name: VLLM_LOGGING_LEVEL
            value: "INFO"
          - name: PYTHONUNBUFFERED
            value: "1"
          - name: NVIDIA_VISIBLE_DEVICES
            value: "all"
          - name: NVIDIA_DRIVER_CAPABILITIES
            value: "compute,utility"
        
        # Simplified volume mounts (remove cuda-libs, keep only what works)
        volumeMounts:
          - name: dshm
            mountPath: /dev/shm
          - name: model-cache
            mountPath: /root/.cache/huggingface
        
        resources:
          limits:
            nvidia.com/gpu: "1"
            memory: 23Gi
          requests:
            nvidia.com/gpu: "1"
            memory: 21Gi
        
        # Same security context as working deployment
        securityContext:
          runAsNonRoot: false
          capabilities:
            drop:
              - ALL
    
    # Simplified volumes
    volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 4Gi
      - name: model-cache
        emptyDir:
          sizeLimit: 20Gi

