apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: deepseek-route
  namespace: beta
  labels:
    ai-gateway: "true"
spec:
  parentRefs:
    - name: ai-gateway
      namespace: envoy-ai-gateway-system
  hostnames:
    - "*"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /v1/
      backendRefs:
        - name: deepseek-33b
          namespace: beta
          port: 8080
