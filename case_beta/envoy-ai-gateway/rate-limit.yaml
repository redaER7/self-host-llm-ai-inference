apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: llm-server-rate-limit
  namespace: beta
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: llm-server-kserve-route
  rateLimit:
    type: Global
    global:
      rules:
        - clientSelectors:
            - headers:
                - name: x-ai-eg-model
                  value: Qwen/Qwen2.5-32B-Instruct-AWQ
          limit:
            requests: 30
            unit: Minute
        - clientSelectors:
            - headers:
                - name: x-ai-eg-model
                  value: Qwen/Qwen2.5-32B-Instruct-AWQ
          limit:
            requests: 5000
            unit: Minute
