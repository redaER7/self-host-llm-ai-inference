apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: beta-rate-limit
  namespace: envoy-ai-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ai-gateway
  rateLimit:
    type: Local
    local:
      rules:
        - clientSelectors:
            - headers:
                - name: x-ai-eg-model
                  type: Exact
                  value: "casperhansen/deepseek-r1-distill-qwen-32b-awq"
          limit:
            requests: 100
            unit: Minute
  timeout:
    http:
      # Long decode batches (non-streaming) routinely run 60-240s; default 15s causes 504s
      requestTimeout: 300s