apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: qwen-rate-limit
  namespace: beta
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: qwen-7b-kserve-route
  rateLimit:
    type: Global
    global:
      rules:
        - clientSelectors:
            - headers:
                - name: x-ai-eg-model
                  value: qwen2.5-7b
          limit:
            requests: 60  # 60 requests per minute
            unit: Minute
        # Token-based rate limiting (requires token counting)
        - clientSelectors:
            - headers:
                - name: x-ai-eg-model
                  value: qwen2.5-7b
          limit:
            requests: 10000  # 10k tokens per minute
            unit: Minute