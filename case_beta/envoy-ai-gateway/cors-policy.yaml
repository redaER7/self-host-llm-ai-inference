apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: cors-policy
  namespace: beta
spec:
  targetRef:
    group: aigateway.envoyproxy.io
    kind: AIGatewayRoute
    name: qwen-route
  cors:
    allowOrigins:
      - type: Regex
        value: "https?://(localhost|chat\\.yacodata\\.com|.*\\.yacodata\\.com)(:\\d+)?"
    allowMethods:
      - POST
      - OPTIONS
      - GET
    allowHeaders:
      - Content-Type
      - Authorization
    maxAge: "86400"
