# ClientTrafficPolicy for the ai-gateway Gateway.
#
# NOTE: Envoy Gateway allows only ONE ClientTrafficPolicy per target.
# This file consolidates the live `request-buffer-limit` policy — merge any
# settings from that policy here before applying:
#   kubectl -n envoy-ai-gateway-system get clienttrafficpolicy request-buffer-limit -o yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: request-buffer-limit
  namespace: envoy-ai-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ai-gateway
  timeout:
    http:
      # Non-streaming decode batches routinely run 60-240s; default 15s causes 504s
      requestTimeout: 300s
  # TODO: copy the http1 maxRequestHeadersKb / buffer limit settings from the live policy
