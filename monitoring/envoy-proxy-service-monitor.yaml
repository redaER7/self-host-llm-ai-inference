apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: envoy-proxy-monitor
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - envoy-gateway-system
  selector:
    matchLabels:
      gateway.envoyproxy.io/owning-gateway-name: alpha-gateway
  endpoints:
    - port: metrics
      path: /stats/prometheus
      interval: 15s
