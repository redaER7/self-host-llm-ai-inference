# dcgm-exporter Helm values — pin the exporter to GPU nodes only.
# Without nodeSelector/tolerations the DaemonSet lands on the control-plane
# node (no GPU) and CrashLoops with a bare `exit status 1`.
# Applied by case_beta/k8s_deploy.sh (step 12) via:
#   helm upgrade --install dcgm-exporter gpu-helm-charts/dcgm-exporter \
#     --namespace monitoring --version 4.8.3 \
#     -f monitoring/dcgm-exporter-values.yaml
nodeSelector:
  node-role.kubernetes.io/gpu-node: "true"

tolerations:
  - key: "gpu-node"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"

# NOTE: the key is `additionalLabels`, NOT `labels` — the chart has no
# `serviceMonitor.labels` key, so `--set serviceMonitor.labels.release=...`
# silently does nothing and Prometheus (serviceMonitorSelector `release:
# kube-prometheus-stack`) ignores the ServiceMonitor.
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 25s
  additionalLabels:
    release: kube-prometheus-stack
