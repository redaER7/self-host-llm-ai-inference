apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  namespace: alpha
spec:
  selector:
    app: vllm
  ports:
    - protocol: TCP
      port: 8100
      targetPort: 8100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8100"
    spec:
      dnsPolicy: ClusterFirst
      nodeSelector:
        node-role.kubernetes.io/gpu-node: "true"
      hostNetwork: true
      tolerations:
        - key: "gpu-node"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          command:
            - python3
            - -m
            - vllm.entrypoints.openai.api_server
          args:
            - --model
            - Qwen/Qwen2.5-3B-Instruct  #Qwen/Qwen2.5-7B-Instruct
            - --port
            - "8100"
            - --host
            - "0.0.0.0"
            - --dtype
            - auto
            - --max-model-len
            - "16384"
            - --gpu-memory-utilization
            - "0.92"
            - --download-dir
            - /root/.cache/huggingface
            - --enable-prefix-caching
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: HF_XET_HIGH_PERFORMANCE
              value: "1"
            - name: VLLM_LOGGING_LEVEL
              value: "INFO"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - containerPort: 8100
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: "20Gi"
            requests:
              nvidia.com/gpu: "1"
              memory: "8Gi"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: model-cache
              mountPath: /root/.cache/huggingface
          securityContext:
            capabilities:
              drop:
                - ALL
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "4Gi"
        - name: model-cache
          emptyDir:
            sizeLimit: "20Gi"