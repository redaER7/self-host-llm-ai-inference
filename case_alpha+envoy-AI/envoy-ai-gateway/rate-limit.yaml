apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: qwen-rate-limit
  namespace: alpha
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: alpha-gateway
  rateLimit:
    type: Global
    global:
      rules:
        - limit:
            requests: 60
            unit: Minute
        - limit:
            requests: 10000
            unit: Minute
