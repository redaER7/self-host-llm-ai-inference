apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: qwen-route
  namespace: alpha
spec:
  parentRefs:
    - name: alpha-gateway
      namespace: alpha
      sectionName: llm-https
  rules:
    - backendRefs:
        - name: qwen-aiservicebackend
      timeouts:
        # Overrides controller default 60s — long non-streaming decode batches run 60-240s
        request: 300s
  llmRequestCosts:
    - metadataKey: llm_input_token
      type: InputToken
    - metadataKey: llm_output_token
      type: OutputToken
    - metadataKey: llm_total_token
      type: TotalToken
