apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-issuer
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@yacodata.com
    privateKeySecretRef:
      name: letsencrypt-key
    solvers:
      - dns01:
          cloudflare:
            email: admin@yacodata.com
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: alpha-tls-cert
  namespace: alpha
spec:
  secretName: alpha-tls-cert
  dnsNames:
    - llm.yacodata.com
    - chat.yacodata.com
  issuerRef:
    name: letsencrypt-issuer
    kind: ClusterIssuer
