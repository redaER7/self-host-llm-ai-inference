apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: omega-route
  namespace: omega
spec:
  parentRefs:
    - name: ai-gateway
      namespace: envoy-ai-gateway-system
  rules:
    - matches:
        - headers:
            - name: x-ai-eg-model
              value: "meta-llama/Llama-3.1-70B-Instruct"
      backendRefs:
        - name: llama70b-backend
    - matches:
        - headers:
            - name: x-ai-eg-model
              value: "mistralai/Mistral-7B-Instruct-v0.3"
      backendRefs:
        - name: mistral7b-backend
  llmRequestCosts:
    - metadataKey: llm_input_token
      type: InputToken
    - metadataKey: llm_output_token
      type: OutputToken
    - metadataKey: llm_total_token
      type: TotalToken
