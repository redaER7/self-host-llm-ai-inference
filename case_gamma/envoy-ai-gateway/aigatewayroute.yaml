---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ai-gateway
  namespace: envoy-ai-gateway-system
spec:
  gatewayClassName: envoy-ai-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: AIGatewayRoute
metadata:
  name: gamma-route
  namespace: gamma
spec:
  parentRefs:
    - name: ai-gateway
      namespace: envoy-ai-gateway-system
  rules:
    - matches:
        - headers:
            - name: x-ai-eg-model
              value: "Qwen/Qwen2.5-7B-Instruct-AWQ"
      backendRefs:
        - name: qwen7b-backend
          namespace: gamma
          kind: AIServiceBackend
      llmRequestCosts:
        - backend:
            name: qwen7b-backend
            namespace: gamma
          inputTokenCost: 0.0001
          outputTokenCost: 0.0001
    - matches:
        - headers:
            - name: x-ai-eg-model
              value: "Qwen/Qwen2.5-14B-Instruct-AWQ"
      backendRefs:
        - name: qwen14b-backend
          namespace: gamma
          kind: AIServiceBackend
      llmRequestCosts:
        - backend:
            name: qwen14b-backend
            namespace: gamma
          inputTokenCost: 0.0003
          outputTokenCost: 0.0003
