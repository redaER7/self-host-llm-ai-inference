---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ai-gateway
  namespace: envoy-ai-gateway-system
spec:
  gatewayClassName: envoy-ai-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: gamma-route
  namespace: gamma
spec:
  parentRefs:
    - name: ai-gateway
      namespace: envoy-ai-gateway-system
  rules:
    - matches:
        - headers:
            - name: x-ai-eg-model
              value: "Qwen/Qwen2.5-7B-Instruct-AWQ"
      backendRefs:
        - name: qwen7b-backend
          namespace: gamma
          kind: AIServiceBackend
    - matches:
        - headers:
            - name: x-ai-eg-model
              value: "Qwen/Qwen2.5-14B-Instruct-AWQ"
      backendRefs:
        - name: qwen14b-backend
          namespace: gamma
          kind: AIServiceBackend
  llmRequestCosts:
    - metadataKey: llm_input_token
      type: InputToken
    - metadataKey: llm_output_token
      type: OutputToken
    - metadataKey: llm_total_token
      type: TotalToken
