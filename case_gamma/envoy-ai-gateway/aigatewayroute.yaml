apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: gamma-route
  namespace: gamma
spec:
  parentRefs:
    - name: ai-gateway
      namespace: envoy-ai-gateway-system
  rules:
    - matches:
        - headers:
            - name: x-ai-eg-model
              value: "Qwen/Qwen2.5-7B-Instruct-AWQ"
      backendRefs:
        - name: qwen7b-backend
    - matches:
        - headers:
            - name: x-ai-eg-model
              value: "Qwen/Qwen2.5-14B-Instruct-AWQ"
      backendRefs:
        - name: qwen14b-backend
  llmRequestCosts:
    - metadataKey: llm_input_token
      type: InputToken
    - metadataKey: llm_output_token
      type: OutputToken
    - metadataKey: llm_total_token
      type: TotalToken
