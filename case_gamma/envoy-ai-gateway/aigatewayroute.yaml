apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gamma-routes
  namespace: gamma
  labels:
    ai-gateway: "true"
spec:
  parentRefs:
    - name: ai-gateway
      namespace: envoy-ai-gateway-system
  hostnames:
    - "*"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/
          headers:
            - type: Exact
              name: x-ai-eg-model
              value: qwen2.5-7b
      backendRefs:
        - name: qwen-llm
          namespace: gamma
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /v1/
          headers:
            - type: Exact
              name: x-ai-eg-model
              value: llama3-70b
      backendRefs:
        - name: llama-llm
          namespace: gamma
          port: 8080
