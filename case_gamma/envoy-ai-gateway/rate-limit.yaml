---
# Global rate limit policy targeting the AIGatewayRoute.
# Rate limits are per-model based on the x-ai-eg-model header.
# Envoy AI Gateway resolves per-backend rate limits from AIGatewayRoute rules.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: gamma-rate-limit-global
  namespace: gamma
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIGatewayRoute
      name: gamma-route
  rateLimit:
    global:
      rules:
        # Qwen 2.5 7B — faster model, higher limit
        - clientSelectors:
            - headers:
                - name: x-ai-eg-model
                  type: Exact
                  value: "Qwen/Qwen2.5-7B-Instruct-AWQ"
          limit:
            requests: 50
            unit: Minute
        # Qwen 2.5 14B — slower model, standard limit
        - clientSelectors:
            - headers:
                - name: x-ai-eg-model
                  type: Exact
                  value: "Qwen/Qwen2.5-14B-Instruct-AWQ"
          limit:
            requests: 30
            unit: Minute
---
# Global token rate limit for Qwen 2.5 7B (10K tok/min)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: gamma-rate-limit-qwen7b-tokens
  namespace: gamma
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIGatewayRoute
      name: gamma-route
  rateLimit:
    global:
      rules:
        - clientSelectors:
            - headers:
                - name: x-ai-eg-model
                  type: Exact
                  value: "Qwen/Qwen2.5-7B-Instruct-AWQ"
