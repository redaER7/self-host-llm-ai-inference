            requests: 10000
            unit: Minute
---
# Global token rate limit for Qwen 2.5 14B (5K tok/min)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: gamma-rate-limit-qwen14b-tokens
  namespace: gamma
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIGatewayRoute
