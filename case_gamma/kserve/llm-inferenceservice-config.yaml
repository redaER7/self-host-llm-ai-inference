apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceServiceConfig
metadata:
  name: llm-d-template
  namespace: gamma
spec:
  router:
    scheduler:
      endpointPicker:
        plugins:
          - name: prefix-cache-scorer
            weight: 2.0
          - name: load-aware-scorer
            weight: 1.0
        picker:
          policy: max-score
    route:
      cache:
        enabled: true
        maxCacheCapacity: 10000
      timeout: 300s
