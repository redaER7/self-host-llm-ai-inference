apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: alpha
spec:
  type: ClusterIP
  selector:
    app: llm-gateway
  ports:
    - protocol: TCP
      port: 8200
      targetPort: 8200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-gateway
  template:
    metadata:
      labels:
        app: llm-gateway
    spec:
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: "5"
          - name: attempts
            value: "3"
          - name: timeout
            value: "10"
          - name: rotate
            value: "true"
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: gateway
          image: docker-registry.yacodata.com/llm-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8200
          env:
            - name: VLLM_URL
              value: "http://10.10.0.2:8100"
            - name: VLLM_TIMEOUT
              value: "300"
          resources:
            limits:
              cpu: "1"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"