apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: alpha
spec:
  type: ClusterIP
  selector:
    app: llm-gateway
  ports:
    - protocol: TCP
      port: 8200
      targetPort: 8200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-gateway
  template:
    metadata:
      labels:
        app: llm-gateway
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
        - name: gateway
          image: llm-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8200
          command: 
            - uvicorn
            - main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8200"
          env:
            - name: VLLM_URL
              value: "http://10.8.0.2:8100" # GPU node WireGuard IP
            - name: VLLM_TIMEOUT
              value: "120"
          resources:
            limits:
              cpu: "1"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
