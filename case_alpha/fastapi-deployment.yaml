apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: alpha
spec:
  type: ClusterIP
  selector:
    app: llm-gateway
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-gateway
  template:
    metadata:
      labels:
        app: llm-gateway
    spec:
      containers:
        - name: gateway
          image: llm-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: VLLM_URL
              value: "http://vllm-service.alpha.svc.cluster.local:8000"
            - name: VLLM_TIMEOUT
              value: "120"
          resources:
            limits:
              cpu: "1"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
