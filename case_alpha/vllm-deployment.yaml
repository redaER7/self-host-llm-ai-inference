apiVersion: v1
kind: Namespace
metadata:
  name: alpha
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  namespace: alpha
spec:
  selector:
    app: vllm
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          command:
            - python3
            - -m
            - vllm.entrypoints.openai.api_server
          args:
            - --model
            - Qwen/Qwen2.5-0.5B-Instruct
            - --port
            - "8000"
            - --host
            - "0.0.0.0"
            - --dtype
            - auto
            - --max-model-len
            - "4096"
            - --gpu-memory-utilization
            - "0.50"
          ports:
            - containerPort: 8000
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: HF_ENDPOINT
              value: "https://huggingface.co"  # Use default, or use mirror if needed
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: "8Gi"
            requests:
              nvidia.com/gpu: "1"
              memory: "4Gi"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: model-cache
              mountPath: /root/.cache/huggingface
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "2Gi"
        - name: model-cache
          emptyDir:
            sizeLimit: "5Gi"