apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  namespace: alpha
spec:
  selector:
    app: vllm
  ports:
    - protocol: TCP
      port: 8100
      targetPort: 8100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      dnsConfig:
        nameservers:
          - 8.8.8.8
          - 1.1.1.1
          - 10.43.0.10  # CoreDNS as fallback
        options:
          - name: ndots
            value: "1"
      nodeSelector:
        node-role.kubernetes.io/gpu-node: "true"
      tolerations:
        - key: "gpu-node"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          command:
            - python3
            - -m
            - vllm.entrypoints.openai.api_server
          args:
            - --model
            - TheBloke/DeepSeek-Coder-33B-Instruct-AWQ
            - --port
            - "8100"
            - --host
            - "0.0.0.0"
            - --dtype
            - auto
            - --max-model-len
            - "4096"
            - --gpu-memory-utilization
            - "0.9"
          ports:
            - containerPort: 8100
              hostPort: 8100
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: "22Gi"
            requests:
              nvidia.com/gpu: "1"
              memory: "18Gi"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: model-cache
              mountPath: /root/.cache/huggingface
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "2Gi"
        - name: model-cache
          emptyDir:
            sizeLimit: "5Gi"