apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextchat
  namespace: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextchat
  template:
    metadata:
      labels:
        app: nextchat
    spec:
      containers:
        - name: nextchat
          image: yidadaa/chatgpt-next-web:latest
          ports:
            - containerPort: 3000
          env:
            - name: BASE_URL
              value: "https://llm.yacodata.com/v1"
            - name: CUSTOM_MODELS
              value: "qwen2.5-7b"
            - name: TLS_CERT
              value: "/certs/tls.crt"
            - name: TLS_KEY
              value: "/certs/tls.key"
          volumeMounts:
            - name: tls-cert
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: tls-cert
          secret:
            secretName: frontend-tls-cert
